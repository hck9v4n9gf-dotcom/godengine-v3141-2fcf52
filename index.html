<!DOCTYPE html>
<html lang="en">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<title>GødEngine V3.14.1</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #0b0c10;
    color: #e8e6e3;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem 3rem;
    box-sizing: border-box;
    text-align: center;
  }
  h1 {
    font-weight: 650;
    letter-spacing: 0.04em;
    font-size: 1.35rem;
    margin: 0 0 0.35rem;
  }
  p {
    margin: 0 0 1.75rem;
    color: #a8a59e;
    font-size: 0.95rem;
    max-width: 22rem;
    line-height: 1.45;
  }
  a.start {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: min(16rem, 86vw);
    min-height: 4.25rem;
    padding: 0.9rem 1.5rem;
    background: #c9a227;
    color: #14110a;
    text-decoration: none;
    font-weight: 800;
    font-size: 1.5rem;
    letter-spacing: 0.12em;
    border-radius: 999px;
    box-shadow: 0 8px 30px rgba(201, 162, 39, 0.35);
  }
  a.start:active { transform: scale(0.98); }
  a.book {
    margin-top: 1.4rem;
    color: #d7c27a;
    font-size: 1rem;
  }
  .ver {
    margin-top: 2.2rem;
    color: #6e6b66;
    font-size: 0.75rem;
  }

<body>
  <main class="wrap">
    <h1>GødEngine V3.14.1</h1>

    <a class="start" href="godengine.html">START</a>
    <a class="book" href="book.html">Book of Reality</a>
    <div class="ver">Testing GødEngine · V3.14.1</div>
  </main>
</body>
</html>
